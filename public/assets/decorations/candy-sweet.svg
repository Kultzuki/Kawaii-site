    <!-- Diagonal Stripes -->
    <path d="M48 16C54 22 54 48 48 54" stroke="#FF3366" stroke-width="6" stroke-linecap="round"/>
    <path d="M60 13C66 21 66 49 60 57" stroke="#FFC837" stroke-width="6" stroke-linecap="round"/>
    <path d="M72 16C78 22 78 48 72 54" stroke="#2264E5" stroke-width="6" stroke-linecap="round"/>
